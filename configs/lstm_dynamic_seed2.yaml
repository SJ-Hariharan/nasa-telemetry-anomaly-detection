# Ablation: the reference LSTM (saved models of run 'full_seed2', no retraining) + Telemanom's dynamic threshold.
# Only the error smoothing and the decision rule change. Run: python -m src.cli derive --config configs/lstm_dynamic_seed2.yaml
inherit: telemanom.yaml
run_name: lstm_dynamic_seed2
derived_from: full_seed2
methods: [lstm_dynamic]
lstm_dynamic:
  smoothing_span: 105       # same smoothing as the telemanom method
  warmup_fill: 250
seed: 2
