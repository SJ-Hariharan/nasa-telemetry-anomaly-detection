# Offline first-run demo on SIMULATED telemetry: `python -m src.cli demo` (~30 s, no download, no network).
# The data is generated by src/demo.py. Results are NOT NASA benchmark results.
inherit: default.yaml

run_name: demo
simulated: true                        # read by the dashboard to label every page "SIMULATED DEMO"

data:
  raw_dir: data/demo/telemanom_synthetic
  channels: all
  spacecraft: all

baseline:
  window: 50

isolation_forest:
  lags: 10
  stat_window: 30
  n_estimators: 100

lstm:
  window: 50
  hidden_size: 16
  num_layers: 1
  epochs: 10
  patience: 3
  max_train_windows: 800
